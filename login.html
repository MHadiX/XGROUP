<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Secure Login</title>

  <style>
    body {
      margin: 0;
      background: #07090f;
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: rgba(16, 19, 28, 0.95);
      border: 1px solid rgba(230, 57, 70, 0.3);
      padding: 40px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      text-align: center;
    }

    h2 {
      color: white;
      margin-bottom: 20px;
      font-family: monospace;
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: monospace;
      outline: none;
    }

    input:focus {
      border-color: #e63946;
      box-shadow: 0 0 10px rgba(230,57,70,0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #e63946, #c0303c);
      color: white;
      font-family: monospace;
      cursor: pointer;
      letter-spacing: 2px;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .msg {
      margin-top: 10px;
      font-size: 12px;
      font-family: monospace;
      color: #e63946;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>X GROUP LOGIN</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">LOGIN</button>

  <div class="msg" id="msg"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔴 PUT YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyC-FxLuMgmpZJEeas2A9CuAmk_HhM4KfIg",
  authDomain: "xgroup-f917d.firebaseapp.com",
  projectId: "xgroup-f917d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* username → email mapping */
function toEmail(username) {
  return username + "@team.local";
}

window.login = function () {

  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (!u || !p) {
    msg.innerText = "ENTER CREDENTIALS";
    return;
  }

  const email = toEmail(u);

  signInWithEmailAndPassword(auth, email, p)
    .then(() => {
      window.location.href = "index.html";
    })
    .catch(() => {
      msg.innerText = "INVALID LOGIN";
    });
};

</script>

</body>
</html>
